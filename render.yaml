services:
  - type: web
    name: knowledge-handover
    env: node
    rootDirectory: backend
    buildCommand: npm run install:all
    startCommand: node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    plan: free